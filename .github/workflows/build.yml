name: Build Cross-Platform Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --org=com.example

      - name: Configure Android SDK & Subprojects to compileSdk 35
        run: |
          python3 -c "
          import os

          # 1. Update android/app/build.gradle.kts or build.gradle to 35
          for p in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(p):
                  with open(p, 'r', encoding='utf-8') as f:
                      c = f.read()
                  c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
                  c = c.replace('compileSdk = 34', 'compileSdk = 35')
                  c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
                  c = c.replace('compileSdkVersion 34', 'compileSdkVersion 35')
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write(c)
                  print('Updated:', p)

          # 2. Append resolution strategy or plugins configuration without late afterEvaluate
          for p in ['android/build.gradle.kts', 'android/build.gradle']:
              if os.path.exists(p):
                  if p.endswith('.kts'):
                      override = '''
                      subprojects {
                          configurations.all {
                              resolutionStrategy.eachDependency {
                                  if (requested.group == \"androidx.annotation\" && requested.name == \"annotation-experimental\") {
                                      useVersion(\"1.4.1\")
                                  }
                              }
                          }
                      }
                      '''
                  else:
                      override = '''
                      subprojects {
                          configurations.all {
                              resolutionStrategy.eachDependency { details ->
                                  if (details.requested.group == 'androidx.annotation' && details.requested.name == 'annotation-experimental') {
                                      details.useVersion '1.4.1'
                                  }
                              }
                          }
                      }
                      '''
                  with open(p, 'a', encoding='utf-8') as f:
                      f.write('\n' + override + '\n')
                  print('Added override to:', p)

          # 3. Inject Android Permissions & Leanback into Manifest
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              permissions = '''
                  <uses-permission android:name=\"android.permission.INTERNET\" />
                  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
                  <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />
                  <uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />
                  <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
                  <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
                  <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_DATA_SYNC\" />
                  <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
                  <uses-permission android:name=\"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\" />
                  <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
                  <uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />
                  <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />
                  <uses-feature android:name=\"android.hardware.wifi\" android:required=\"false\" />
              '''
              content = content.replace('<application', permissions + '\n    <application')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Manifest configured.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: p2p-file-pool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
