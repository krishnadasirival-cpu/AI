name: Build Cross-Platform Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --org=com.example

      - name: Configure Android SDK & Subprojects to compileSdk 36
        run: |
          python3 -c "
          import os

          # 1. Update android/app/build.gradle.kts or build.gradle to 36
          for p in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(p):
                  with open(p, 'r', encoding='utf-8') as f:
                      c = f.read()
                  c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  c = c.replace('compileSdk = 35', 'compileSdk = 36')
                  c = c.replace('compileSdk = 34', 'compileSdk = 36')
                  c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  c = c.replace('compileSdkVersion 35', 'compileSdkVersion 36')
                  c = c.replace('compileSdkVersion 34', 'compileSdkVersion 36')
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write(c)
                  print('Updated:', p)

          # 2. Add override to android/build.gradle.kts to force all subprojects to compileSdk 36
          root_p = 'android/build.gradle.kts'
          if os.path.exists(root_p):
              override = '''
          subprojects {
              afterEvaluate {
                  if (project.hasProperty(\"android\")) {
                      val androidExt = project.extensions.findByName(\"android\")
                      if (androidExt != null) {
                          try {
                              val compileSdkProp = androidExt.javaClass.getMethod(\"setCompileSdkVersion\", Int::class.javaPrimitiveType)
                              compileSdkProp.invoke(androidExt, 36)
                          } catch (e: Exception) {
                              try {
                                  val compileSdkProp = androidExt.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType)
                                  compileSdkProp.invoke(androidExt, 36)
                              } catch (e2: Exception) {}
                          }
                      }
                  }
              }
          }
          '''
              with open(root_p, 'a', encoding='utf-8') as f:
                  f.write('\n' + override + '\n')
              print('Added subproject compileSdk override to:', root_p)

          # 3. Add gradle.properties flag to disable checkAarMetadata or set compileSdk
          with open('android/gradle.properties', 'a', encoding='utf-8') as f:
              f.write('\nandroid.compileSdk=36\nandroid.experimental.checkDependencies=false\n')

          # 4. Inject Android Permissions & Leanback into Manifest
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              permissions = '''
                  <uses-permission android:name=\"android.permission.INTERNET\" />
                  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
                  <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />
                  <uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />
                  <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
                  <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
                  <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
                  <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_DATA_SYNC\" />
                  <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
                  <uses-permission android:name=\"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\" />
                  <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
                  <uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />
                  <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />
                  <uses-feature android:name=\"android.hardware.wifi\" android:required=\"false\" />
              '''
              content = content.replace('<application', permissions + '\n    <application')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Manifest configured.')
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: p2p-file-pool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
