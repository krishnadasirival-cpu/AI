name: p2p_file_pool
description: "A cross-platform local peer-to-peer virtual file pool application for Android, Android TV, and Windows."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP Server (R1)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.2

  # LAN & Service Discovery (mDNS / Zeroconf) (R1)
  bonsoir: ^5.1.3

  # Permissions & Platform Access (R1)
  permission_handler: ^11.3.1

  # File Handling, Formats & Utilities (R1)
  path: ^1.9.0
  mime: ^2.0.0
  archive: ^3.6.1

  # State Management (R1)
  flutter_riverpod: ^2.6.1

  # Material 3 Expressive UI Theming & Typography (R1)
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1

  # System Path Resolution & Local Storage (R1)
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3

  # Background Server / Persistent Discovery (R1)
  flutter_foreground_task: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
